<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1a2233" stroke-width="0.5"/>
    </pattern>
    <!-- Radial glow behind crowbar -->
    <radialGradient id="glow" cx="50%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <!-- Crowbar gradient -->
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <!-- Metallic highlight -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#0d1117"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- Crowbar (centered, rotated -45deg) -->
  <g transform="translate(960,480) rotate(-45)">
    <!-- Shadow -->
    <g opacity="0.3" transform="translate(6,6)">
      <rect x="-18" y="-200" width="36" height="340" rx="10" fill="#000"/>
      <path d="M-18,-200 Q-18,-248 -72,-260 L-72,-240 Q-30,-232 -18,-192 Z" fill="#000"/>
      <path d="M18,-200 Q18,-230 40,-240 L50,-240 L50,-220 Q28,-214 18,-192 Z" fill="#000"/>
      <rect x="-44" y="126" width="88" height="24" rx="6" fill="#000"/>
      <path d="M-44,150 L-56,168 L-36,168 L-30,150 Z" fill="#000"/>
      <path d="M44,150 L56,168 L36,168 L30,150 Z" fill="#000"/>
    </g>

    <!-- Main shaft -->
    <rect x="-18" y="-200" width="36" height="340" rx="10" fill="url(#bar)"/>
    <rect x="-18" y="-200" width="18" height="340" rx="10" fill="url(#shine)"/>

    <!-- Hook (top-left curved end) -->
    <path d="M-18,-200 Q-18,-248 -72,-260 L-72,-240 Q-30,-232 -18,-192 Z" fill="url(#bar)"/>
    <path d="M-18,-200 Q-18,-248 -72,-260 L-72,-250 Q-36,-240 -18,-200 Z" fill="url(#shine)" opacity="0.4"/>

    <!-- Small claw (top-right) -->
    <path d="M18,-200 Q18,-230 40,-240 L50,-240 L50,-220 Q28,-214 18,-192 Z" fill="url(#bar)"/>

    <!-- Flat chisel end (bottom) -->
    <rect x="-44" y="126" width="88" height="24" rx="6" fill="url(#bar)"/>
    <rect x="-44" y="126" width="88" height="12" rx="6" fill="url(#shine)" opacity="0.3"/>

    <!-- Flared chisel tips -->
    <path d="M-44,150 L-56,168 L-36,168 L-30,150 Z" fill="url(#bar)"/>
    <path d="M44,150 L56,168 L36,168 L30,150 Z" fill="url(#bar)"/>

    <!-- Grip lines on shaft -->
    <g opacity="0.15" stroke="#93c5fd" stroke-width="2">
      <line x1="-14" y1="20" x2="14" y2="20"/>
      <line x1="-14" y1="32" x2="14" y2="32"/>
      <line x1="-14" y1="44" x2="14" y2="44"/>
      <line x1="-14" y1="56" x2="14" y2="56"/>
      <line x1="-14" y1="68" x2="14" y2="68"/>
    </g>
  </g>

  <!-- Text -->
  <text x="960" y="920" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="48" font-weight="700" fill="#e6edf3" letter-spacing="2">
    <tspan fill="#3b82f6" font-style="italic">Crowbar</tspan> Market
  </text>
  <text x="960" y="960" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#8b949e" letter-spacing="4">
    PLUGIN MARKETPLACE FOR PAI
  </text>

  <!-- Subtle corner accents -->
  <path d="M40,40 L40,80 M40,40 L80,40" stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M1880,40 L1880,80 M1880,40 L1840,40" stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M40,1040 L40,1000 M40,1040 L80,1040" stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M1880,1040 L1880,1000 M1880,1040 L1840,1040" stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.3"/>
</svg>
